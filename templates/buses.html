<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шины и контакты</title><link rel="stylesheet" href="/static/dashboard.css">
<script src="/static/buses.js" defer></script></head>
<body><main id="buses" data-operator="{{ 'yes' if operator else 'no' }}">
<nav><a href="/">Состояние платы</a></nav>
<header><h1>Шины и контакты</h1><p id="board">40-контактная гребёнка</p></header>
<section><h2>Занятые контакты</h2>
<label><input type="checkbox" id="all-pins"> Все сигнальные выводы</label>
<div id="pins"></div></section>
<section id="i2c-section" hidden><h2>Частоты I²C0 и I²C1</h2><div id="i2c-rates"></div></section>
<details><summary>Устройства SPI и частоты</summary>
<section><h2>Сейчас</h2><div id="live"></div></section>
<section><h2>При следующей загрузке</h2><div id="current"></div></section></details>
<section><label for="profile">Маршрут для следующей загрузки</label>
<select id="profile" disabled></select>
<button id="preview" type="button" disabled>Предпросмотр</button></section>
<section id="plan" hidden><h2>Предпросмотр</h2><div id="issues" role="alert"></div>
<div id="changes"></div><div id="candidate"></div>
{% if operator %}<button id="apply" type="button" disabled>Сохранить для следующей загрузки</button>{% endif %}</section>
{% if operator %}<button id="undo" type="button" disabled>Откатить последнее изменение</button>{% else %}<p>Для сохранения и отката войдите как operator.</p>{% endif %}
<button id="refresh" type="button">Обновить</button><p id="feedback" role="status"></p>
</main></body></html>
